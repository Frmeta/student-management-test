spring.application.name=demo
spring.devtools.restart.enabled=true

# Server
server.port=8080

# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/student_db?
# mongodb://localhost:27017/student_db?connectTimeoutMS=5000&socketTimeoutMS=10000&serverSelectionTimeoutMS=5000&maxWaitTimeMS=2000&retryWrites=true&retryReads=true

# so the app can start even though can't connect to MongoDB
spring.data.mongodb.repositories.type=auto
# Disable the MongoDB health indicator so the app doesn't marked as DOWN if can't connect to MongoDB
management.health.mongodb.enabled=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=student-group
spring.kafka.consumer.auto-offset-reset=earliest

