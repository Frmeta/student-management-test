spring.application.name=demo
spring.devtools.restart.enabled=true

# Server
server.port=8080

# PostgreSQL Configuration (for core entities: Student, Subject, Enrollment)
spring.datasource.url=jdbc:postgresql://localhost:5432/student_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration (for student portfolio)
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=student_portfolio
spring.data.mongodb.repositories.type=auto

# ScyllaDB Configuration (for audit trail)
spring.cassandra.contact-points=127.0.0.1:9043
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=audit_trail
spring.cassandra.schema-action=CREATE_IF_NOT_EXISTS

# Actuator health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mongodb.enabled=true
management.health.db.enabled=true

# Database circuit breaker
resilience4j.circuitbreaker.instances.database.register-health-indicator=false
resilience4j.circuitbreaker.instances.database.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.database.sliding-window-size=5
resilience4j.circuitbreaker.instances.database.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.database.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.database.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.database.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.database.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.database.record-exceptions=org.springframework.dao.DataAccessException
resilience4j.circuitbreaker.instances.database.ignore-exceptions=com.example.demo.exception.custom.StudentNotFoundException,com.example.demo.exception.custom.SubjectNotFoundException,com.example.demo.exception.custom.EnrollmentNotFoundException,com.example.demo.exception.custom.PortfolioNotFoundException

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=student-group
spring.kafka.consumer.auto-offset-reset=earliest

